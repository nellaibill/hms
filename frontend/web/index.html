<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) resolve to a real value on notched/gesture-bar
         devices (iOS home indicator, etc.) instead of always being 0 — needed for the mobile nav
         drawer's bottom padding (see TopHeader.tsx) to actually clear the device's own UI. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HMS</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (MIT) — https://github.com/rafgraph/spa-github-pages
      // Decodes the path 404.html encoded into the query string back into a real URL via
      // history.replaceState, before React Router mounts and reads window.location.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="text/javascript">
      // Mirrors lib/theme-provider.tsx's getInitialTheme() exactly (same storage key, same
      // prefers-color-scheme fallback) so the splash screen below picks the right background
      // before React (and index.css) have loaded — without this, a dark-mode user would see a
      // white flash for the entire first-load window this splash exists to smooth over.
      (function () {
        var stored = localStorage.getItem('hms-theme');
        var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');

        // Paints the theme of the hospital this browser last signed in to (written by
        // features/branding/mockBrandingStore.ts's rememberTheme()) before the bundle, index.css
        // or the branding API call have loaded, so a hospital whose theme differs from the
        // built-in one doesn't flash that built-in theme first on every load. React then keeps
        // the same values (lib/apply-branding.ts) until the hospital's branding has been fetched.
        try {
          var cached = JSON.parse(localStorage.getItem('hms-branding-theme') || 'null');
          if (!cached) return;
          var maps = [isDark ? cached.tokensDark : cached.tokensLight, cached.typographyCss];
          for (var i = 0; i < maps.length; i++) {
            for (var key in maps[i]) {
              if (key.indexOf('--') === 0 && typeof maps[i][key] === 'string') {
                document.documentElement.style.setProperty(key, maps[i][key]);
              }
            }
          }
        } catch (e) {
          // Unreadable cache — index.css's built-in theme applies instead.
        }
      })();
    </script>
    <style>
      /* Self-contained (no Tailwind/index.css dependency) so it paints immediately from raw
         HTML, before the JS bundle has downloaded/parsed/executed — that gap, not the
         already-covered per-route Suspense fallback, is what a slow first load actually spends
         most of its time in. It reads the theme variables the script above set from this
         browser's remembered theme, falling back to the built-in LHS theme's values from
         index.css, so there's no visible swap once React mounts and replaces this. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: hsl(var(--background, 0 0% 100%));
        color: hsl(var(--muted-foreground, 215 16% 47%));
        font-family: var(--font-sans, Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif);
        font-size: 14px;
      }
      html.dark #app-splash {
        background: hsl(var(--background, 222 47% 7%));
        color: hsl(var(--muted-foreground, 215 18% 68%));
      }
      #app-splash-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid hsl(var(--primary, 38 93% 57%) / 0.25);
        border-top-color: hsl(var(--primary, 38 93% 57%));
        animation: app-splash-spin 0.8s linear infinite;
      }
      html.dark #app-splash-spinner {
        border-color: hsl(var(--primary, 210 82% 45%) / 0.25);
        border-top-color: hsl(var(--primary, 210 82% 45%));
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced the instant createRoot(...).render() commits in main.tsx — plain markup,
           not a React tree, so it needs no cleanup of its own. -->
      <div id="app-splash" aria-hidden="true">
        <div id="app-splash-spinner"></div>
        <p>Loading HMS…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
