server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backs the docker-compose healthcheck.
    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    # SPA fallback: React Router owns client-side routes like /patients/123, which don't
    # exist as real files — always serve index.html and let the client router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
