server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses createBrowserRouter (real paths, no hash) — any path that isn't a
    # real static asset must fall back to index.html so client-side routing can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
