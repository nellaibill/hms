name: hms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Becomes a Postgres superuser (CREATEDB included) — matches the existing local-dev
      # convention (appsettings.Development.json), which is what lets EF Core's
      # Database.Migrate() auto-create hms_platform / the legacy tenant DB on first run, and
      # what TenantProvisioningService's raw CREATE DATABASE uses for every tenant after
      # that. POSTGRES_DB is just the image's mandatory bootstrap database, not one HMS uses.
      POSTGRES_USER: ${POSTGRES_USER:-hms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hms}
      POSTGRES_DB: postgres
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for demo convenience (inspecting data with psql/pgAdmin from the host) — not
      # required for the app itself, which talks to the "postgres" service name internally.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hms} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Runs the Development branch in Program.cs on purpose — that's the code path that
      # calls Database.Migrate()/seeds the Platform Admin + legacy tenant on startup (see
      # docs/Deployment.md's note that a real deploy-time migration step doesn't exist yet).
      # appsettings.Development.json's placeholder connection strings/CORS list are then
      # overridden below via the standard Section__Key env var convention (docs/Configuration.md).
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${TENANT_DB_NAME:-hms_qa};Username=${POSTGRES_USER:-hms};Password=${POSTGRES_PASSWORD:-hms}
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=hms_platform;Username=${POSTGRES_USER:-hms};Password=${POSTGRES_PASSWORD:-hms}
      ConnectionStrings__PlatformAdmin: Host=postgres;Port=5432;Database=postgres;Username=${POSTGRES_USER:-hms};Password=${POSTGRES_PASSWORD:-hms}

      # Additive: appsettings.Development.json already lists localhost:5173 etc. for native
      # `npm run dev` use; this just adds the browser-facing origin of the dockerized
      # frontend so it isn't blocked by CORS.
      Cors__AllowedOrigins__11: http://localhost:${FRONTEND_PORT:-8081}

      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env — see .env.example}
      SuperAdminSeed__Password: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in .env — see .env.example}
      PlatformAdminSeed__Password: ${PLATFORM_ADMIN_PASSWORD:?Set PLATFORM_ADMIN_PASSWORD in .env — see .env.example}
    volumes:
      # Persists patient/product/document/branding uploads (HMS.Api's wwwroot/uploads)
      # across container recreation — see the various *FileStorage classes.
      - hms_uploads:/app/wwwroot/uploads
    ports:
      - "${API_PORT:-8080}:8080"

  frontend:
    build:
      context: frontend
      dockerfile: web/Dockerfile
      args:
        # Baked into the static bundle at build time — must be reachable from the browser on
        # the host, i.e. the API's published host port, not the "api" service DNS name.
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  hms_pgdata:
  hms_uploads:
