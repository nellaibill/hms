name: Deploy to GitHub Pages

# Deploys frontend/web as a static site for client UI review. There's no live backend behind
# this deploy, so the app runs entirely on in-app demo data — see
# frontend/shared/api-client/offlineHttpClient.ts (feature/demo-ui-with-mock-data forces this
# unconditionally); other branches fall back to the same demo data only when a real backend
# happens to be unreachable (e.g. frontend/web/src/features/patients/mockPatientsStore.ts).
on:
  push:
    branches: [feature/patient-registration, feature/demo-ui-with-mock-data]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # frontend/{web,shared} are npm workspace members — npm resolves and hoists deps
      # against the workspace root's frontend/package-lock.json regardless of which member
      # folder `npm install` is run from, so that's the one file that actually needs
      # removing (per-package lockfiles under web/ and shared/ are unused leftovers).
      # Dropping it before install (never committed back) works around a documented npm bug
      # (https://github.com/npm/cli/issues/4828) where a locked optionalDependencies
      # resolution can omit the current platform's native binary (here,
      # @rollup/rollup-linux-x64-gnu on this Linux runner), causing `vite build` to fail with
      # MODULE_NOT_FOUND even though the lockfile is untouched and correct for local
      # (Windows/macOS) development.
      - name: Reset workspace lockfile for this platform
        working-directory: frontend
        run: rm -f package-lock.json

      - name: Build @hms/shared
        working-directory: frontend/shared
        run: |
          npm install
          npm run build

      - name: Install web dependencies
        working-directory: frontend/web
        run: npm install

      - name: Build web app
        working-directory: frontend/web
        run: npm run build
        env:
          VITE_BASE_PATH: /hms/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
