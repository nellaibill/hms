name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/HMS.sln

      - name: Build
        run: dotnet build backend/HMS.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/HMS.sln --no-build --configuration Release

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [web, mobile, shared]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend/${{ matrix.workspace }}
        run: npm install

      - name: Lint
        working-directory: frontend/${{ matrix.workspace }}
        run: npm run lint --if-present

      - name: Test
        working-directory: frontend/${{ matrix.workspace }}
        run: npm test --if-present
