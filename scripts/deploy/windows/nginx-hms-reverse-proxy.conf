# Native (non-Docker) reverse proxy for a Windows VPS: serves the React production build
# as static files and forwards /api/* to the ASP.NET Core Kestrel process on localhost.
# Adapted from frontend/web/nginx.conf (the Docker image's frontend-only config) - same
# SPA-fallback and /health behavior, plus the /api proxy block that config doesn't need
# because Docker Compose exposes the api container on its own port instead.
#
# Install: choco install nginx -y
# Copy this file over nginx's default site config (typically
# C:\tools\nginx-<version>\conf\conf.d\default.conf, or edit nginx.conf's include),
# update `root` to the built frontend's dist folder, then run/restart nginx.

server {
    listen 80;
    server_name _;

    # Update to the actual path of frontend/web/dist on this machine after `npm run build`.
    root C:/hms/frontend/web/dist;
    index index.html;

    # Chocolatey's stock nginx ships with gzip off — without this, every static asset
    # (the ~677 KB main JS bundle included) goes out uncompressed instead of the ~200 KB
    # gzip build already produces, which dominates first-load time on a bandwidth-limited
    # VPS. gzip_types deliberately excludes already-compressed formats (images, fonts) —
    # recompressing those wastes CPU for no size win.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # nginx rejects request bodies over 1 MB by default (413), which would break uploads the
    # API accepts: documents up to 10 MB, patient photos 2 MB, and patient bulk import up to
    # 30 MB (PatientImportController's RequestSizeLimit). Match the largest API limit.
    client_max_body_size 30m;

    # Baseline security headers for the SPA (the API sets its own on /api responses). nginx
    # drops server-level add_header in any location that declares its own, so /assets/ and
    # /index.html below repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    # ASP.NET Core Web API - Kestrel only needs to listen on localhost here, since nginx is
    # the only thing that needs to reach it. (The API can additionally bind 0.0.0.0 and be
    # opened in the firewall too, for direct testing - see install-api-service.ps1 - but
    # nginx itself only ever needs localhost.)
    location /api/ {
        proxy_pass http://127.0.0.1:58158;
        proxy_http_version 1.1;
        # nginx's 60 s default would cut off slow AI calls (Radiology AI read, discharge-summary
        # AI draft) with a 504 while the API is still working on them.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI is served by the API itself under /swagger - proxy it the same way so it's
    # reachable through the public reverse-proxy origin too, not just the API's own port.
    location /swagger/ {
        proxy_pass http://127.0.0.1:58158;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (Branding logos, product images, patient photos) are served by the API
    # from its own wwwroot/uploads via UseStaticFiles() (Program.cs) - proxy them the same way
    # as /api/ and /swagger/ above. Without this block these URLs fall through to the SPA
    # fallback below and silently return index.html instead of the actual file.
    location /uploads/ {
        proxy_pass http://127.0.0.1:58158;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: React Router owns client-side routes like /patients/123, which don't
    # exist as real files - always serve index.html and let the client router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the content-hashed bundles, so it must never be cached - otherwise
    # browsers keep loading the previous deploy's JS after a rebuild.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hashed filenames change on every build, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
